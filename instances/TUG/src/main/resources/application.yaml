"%oracle":
  quarkus:
    datasource:
      db-kind: oracle
    hibernate-orm:
      dialect: org.hibernate.dialect.OraclecDialect

"%postgres":
  quarkus:
    datasource:
      db-kind: postgresql
    hibernate-orm:
      dialect: org.hibernate.dialect.PostgreSQLDialect

"%test":
