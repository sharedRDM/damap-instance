# custom config settings
# replace these in the config of your custom project or by overriding these variables
damap:
  env: DEV # override in your custom project with PROD for production deployment
  origins: http://localhost:8085 # https://your.frontend.com,https://*.yourdomain.com
  auth:
    backend:
      url: http://keycloak:8080/realms/damap # https://your.authentication.server
      client: "damap" # your-backend-authentication-client-id
    frontend:
      url: http://localhost:8087/realms/damap # usually the same as the backend url
      client: "damap" # your-frontend-authentication-client-id
    scope: "openid profile email offline_access microprofile-jwt roles personID" # your-backend-authentication-scope, including your variable for your user IDs
    user-id-claim: "personID" # v5 key (was `user` in v4)
    # Our "Damap Admin" role is a Keycloak CLIENT role (resource_access.<client>.roles), not a
    # realm role. v5 reads this path for both backend authz and the frontend admin menu.
    user-roles-claim-path: "resource_access/${damap.auth.backend.client}/roles"
  datasource:
    # Default local/compose values. If you deploy via docker-compose, stick to the reverted env var names from base:
    # DAMAP_DATASOURCE_URL, DAMAP_DATASOURCE_USERNAME, DAMAP_DATASOURCE_PASSWORD,
    # DAMAP_DATASOURCE_DB_KIND, DAMAP_DATASOURCE_DRIVER, DAMAP_DATASOURCE_DIALECT.
    url: jdbc:postgresql://damap-db:5432/damap # jdbc:your-datasource-language:your-datasource.address
    username: damap # your-datasource-username
    password: pw4damap # your-datasource-password
    db-kind: postgresql # your database
  # NOTE (v5): recommended repositories are now DB-backed and managed via the Admin UI
  # Admin -> Recommended Repositories. The old `damap.repositories.recommendation` key is
  # no longer read.
  projects-url: https://api.tugraz.at/base/research-projects
  persons-url: https://api.tugraz.at/base/people
  gotenberg-url: ${DAMAP_GOTENBERG_URL}
  re3data-url: ${DAMAP_RE3DATA_URL:https://www.re3data.org/api}

  # v5: per-tenant settings are now read via a config mapping under `damap.tenant-aware.*`.
  # In single-tenant (standalone) mode this is simply our normal config. Settings that used to
  # sit at the `damap.*` top level (project-service, person-services, elsevier-pure-*) must live
  # here now, otherwise they are silently ignored.
  # Project & person services are configured via ENV in deployment (DAMAP_TENANT_AWARE_*), to keep
  # as much config as possible in one place (.env / compose). The custom classes ship in our image;
  # ENV just selects them. This yaml equivalent is kept here, commented, as a reference / fallback —
  # uncomment it to run the services from yaml instead of ENV.
  # tenant-aware:
  #   project-service: default
  #   person-services:
  #     - display-text: "University"
  #       query-value: "UNIVERSITY"
  #       class-name: "at.tugraz.damap.rest.persons.TUGrazPersonServiceImpl"
  #     - display-text: "ORCID"
  #       query-value: "ORCID"
  #       class-name: "org.damap.base.integration.orcid.ORCIDPersonServiceImpl"

    # Optional: Elsevier Pure integration disabled by default. Uncomment if TUG starts using Pure.
    # project-service: elsevier-pure
    # elsevier-pure-description-classification: /dk/atira/pure/projectdescription
    # elsevier-pure-contributor-role-classifications:
    #   - pure-role-uri: /dk/atira/pure/member
    #     contributor-role: PROJECT_MEMBER
    # elsevier-pure-project-lead-role-classification: /dk/atira/pure/projectlead
    # elsevier-pure-backend: http
    # elsevier-pure-endpoint-url: "https://your-pure-instance.elsevierpure.com/ws/api"
    # elsevier-pure-api-key: "your API key here"
    # elsevier-pure-projects-file: "file:///path/to/projects.json"
    # elsevier-pure-persons-file: "file:///path/to/persons.json"
    #   and add to person-services above:
    # - display-text: "Pure"
    #   query-value: "PURE"
    #   class-name: "org.damap.base.integration.pure.PurePersonService"
  tugraz:
    api:
      auth:
        url: https://auth-demo.tugraz.at/auth/realms/tugraz-vpu/protocol/openid-connect/token
        client: "client"
        secret: "secret"

invenio:
  disabled: true
  shared-secret: "thisIsAVerySecretKeyOfAtLeast32Chars"

# general config settings
quarkus:
  # index base package which will register the beans and make endpoint resources available.
  # Can be removed if solved in base package

  http:
    cors:
      ~: true
      origins: ${damap.origins}
      headers: origin,content-type,accept,authorization
      access-control-max-age: 1
    # max upload size for in-process file analysis (Apache Tika)
    limits:
      max-body-size: 10M

  oidc:
    auth-server-url: ${damap.auth.backend.url}
    client-id: ${damap.auth.backend.client}
    token:
      issuer: ${damap.auth.frontend.url}

  datasource:
    jdbc:
      url: ${damap.datasource.url}
    db-kind: ${damap.datasource.db-kind}
    username: ${damap.datasource.username}
    password: ${damap.datasource.password}

  hibernate-orm:
    database:
      generation: none
    sql-load-script: no-file

  cache:
    caffeine:
      "repositories":
        enabled: ${DAMAP_CACHE_REPOSITORIES_ENABLED:false}
        expire-after-write: ${DAMAP_CACHE_EXPIRE_AFTER_WRITE:P1D}
      "repository":
        enabled: ${DAMAP_CACHE_REPOSITORY_ENABLED:false}
        expire-after-write: ${DAMAP_CACHE_EXPIRE_AFTER_WRITE:P1D}

  liquibase:
    migrate-at-start: true
    change-log: at/tugraz/damap/db/mainChangeLog.yaml

  smallrye-openapi:
    info-title: DAMAP API

  swagger-ui:
    always-include: true # set to false if swagger-ui should only be available in dev mode
    oauth-client-id: ${damap.auth.frontend.client}

rest:
  projects/mp-rest/url: ${damap.projects-url}
  persons/mp-rest/url: ${damap.persons-url}
  r3data:
    repositories/mp-rest/url: ${damap.re3data-url}
    repository/mp-rest/url: ${damap.re3data-url}
    repositories/mp-rest/scope: jakarta.inject.Singleton
    repository/mp-rest/scope: jakarta.inject.Singleton
  openaire/mp-rest/url: http://api.openaire.eu/search/
  orcid:
    search/mp-rest/url: https://pub.orcid.org
  tugraz:
    api:
      auth/mp-rest/url: ${damap.tugraz.api.auth.url}

